# Cloudflare Workers, no Pages.
#
# Pages sigue soportado y para un sitio estático funciona igual, pero
# Cloudflare mantiene guía de migración de Pages a Workers y es en Workers
# donde llega lo nuevo. Empezar aquí evita una migración futura y da, en el
# mismo sitio, el endpoint del formulario de contacto, que con Astro estático
# puro no existe.

name = "accesibilidadprimero"
compatibility_date = "2026-10-01"
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# El HTML lo sirve el runtime de assets; el Worker solo entra para las rutas
# que necesitan servidor (hoy, el formulario de contacto).
not_found_handling = "404-page"
# El Worker entra ANTES que los archivos solo en /api/*: así un POST al
# formulario nunca acaba en la página 404 y el resto de la web no paga ni un
# milisegundo de Worker.
run_worker_first = ["/api/*"]

# Formulario de contacto (Johnny, 10/10/2026: Worker + Brevo + Turnstile).
# Estos valores no son secretos. Los dos secretos, BREVO_API_KEY y
# TURNSTILE_SECRET, se guardan en el panel de Cloudflare (Worker → Settings →
# Variables and Secrets) y no se escriben nunca en el repositorio.
[vars]
CORREO_DESTINO = "proyectos@accesibilidadprimero.com"
# El remitente tiene que ser un remitente verificado en Brevo.
CORREO_REMITENTE = "proyectos@accesibilidadprimero.com"
# Dominios desde los que se acepta el formulario. Sin localhost: en producción
# no debe valer una ficha conseguida en local.
TURNSTILE_HOSTNAMES = "accesibilidadprimero.com,www.accesibilidadprimero.com,accesibilidadprimero.eu,www.accesibilidadprimero.eu,accesibilidadprimero.proyectos-44e.workers.dev"

[observability]
enabled = true

# Analítica sin cookies y sin banner: Cloudflare Web Analytics se activa desde
# el panel, no desde aquí. Microsoft Clarity queda descartado — exige señal de
# consentimiento para el EEE desde el 31/10/2025, lo que obliga a un modal de
# cookies en la web de un estudio de accesibilidad.
